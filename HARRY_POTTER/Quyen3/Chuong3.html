 <!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Học Tiếng Anh Qua Truyện - Harry Potter</title>
    <link rel="stylesheet" href="cs.css">
    
</head>
<body>

<div class="book-page">
        <div class="instruction">
            📖 <b>Chương 3: The Leaky Cauldron </b>
        </div>
        <div class="audio-player-container">
            <audio id="chapter-audio" src="18_Chapter_18_ Dobby_s_Reward.mp3" preload="metadata"></audio>
            
            <button id="play-pause-btn" class="play-btn" title="Phát/Tạm dừng">▶</button>
            
            <div class="progress-wrapper">
                <span id="current-time">0:00</span>
                <input type="range" id="progress-bar" value="0" max="100">
                <span id="duration-time">0:00</span>
            </div>

            <select id="speed-select" class="speed-control" title="Tốc độ đọc">
                <option value="0.5">0.5x</option>
                <option value="0.75">0.75x</option>
                <option value="1" selected>1.0x (Chuẩn)</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
            </select>
        </div>
        <div class="pagination-controls">
            <button id="prev-page" class="page-btn" disabled>&#8592; Trước</button>
            <span id="page-info" class="page-info">Trang 1 / 1</span>
            <button id="next-page" class="page-btn">Sau &#8594;</button>
        </div>

        <div id="story-content"></div>
    </div>

    <div id="dict-panel" class="dict-panel">
        <button id="close-panel" class="close-panel" title="Đóng">&times;</button>
        <div class="panel-container">
            <div class="panel-header">
                <span id="dict-word" class="dict-word">Từ vựng</span>
                <span id="dict-ipa" class="dict-ipa">/phát âm/</span>
                <button id="dict-audio-btn" class="dict-audio-btn">🔊</button>
            </div>
            <div id="dict-meaning" class="dict-meaning">Nghĩa của từ...</div>
        </div>
    </div>

        let audioUrl = "";

            `;
    </script>
    <script src="js.js"></script>
</body>
</html>
