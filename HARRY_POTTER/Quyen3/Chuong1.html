But Aunt Petunia and Uncle Vernon (Nhưng dì Petunia và dượng Vernon) were both looking at Harry (đều đang nhìn Harry) suspiciously, (một cách đầy nghi ngờ) so he decided (nên cậu quyết định) he’d better skip pudding (tốt hơn là nên bỏ qua món tráng miệng) and escape from the table (và chuồn khỏi bàn ăn) as soon as he could. (càng sớm càng tốt)

Outside in the hall, (Bên ngoài hành lang) he leant against the wall, (cậu dựa vào tường) breathing deeply. (thở sâu) It had been a long time (Đã lâu lắm rồi) since he’d lost control (kể từ lần cậu mất kiểm soát) and made something explode. (và làm nổ tung một thứ gì đó) He couldn’t afford (Cậu không thể cho phép) to let it happen again. (điều đó xảy ra lần nữa) The Hogsmeade form (Tờ đơn đi Hogsmeade) wasn’t the only thing at stake – (không phải là thứ duy nhất bị đe dọa –) if he carried on like that, (nếu cậu cứ tiếp tục như thế) he’d be in trouble (cậu sẽ gặp rắc rối) with the Ministry of Magic. (với Bộ Pháp thuật)

Harry was still (Harry vẫn còn là) an underage wizard, (một phù thủy vị thành niên) and he was forbidden (và cậu bị cấm) by wizard law (bởi luật phù thủy) to do magic (không được làm phép) outside school. (bên ngoài trường học) His record wasn’t exactly clean, either. (Hồ sơ của cậu cũng chẳng hoàn toàn sạch sẽ gì) Only last summer (Mới mùa hè năm ngoái) he’d got an official warning (cậu đã nhận một lời cảnh cáo chính thức) which had stated quite clearly (trong đó nói rất rõ) that if the Ministry got wind (rằng nếu Bộ đánh hơi thấy) of any more magic (có thêm bất kỳ phép thuật nào) in Privet Drive, (ở đường Privet Drive) Harry would face expulsion (Harry sẽ đối mặt với việc bị đuổi học) from Hogwarts. (khỏi Hogwarts)

He heard the Dursleys (Cậu nghe thấy nhà Dursley) leaving the table (rời khỏi bàn ăn) and hurried upstairs (và vội vã chạy lên lầu) out of the way. (để tránh mặt)

* Harry got through (Harry đã vượt qua) the next three days (ba ngày tiếp theo) by forcing himself (bằng cách ép bản thân) to think about (nghĩ về) his Handbook of Do-it-Yourself Broomcare (cuốn Cẩm nang Tự Bảo dưỡng Chổi) whenever Aunt Marge (mỗi khi dì Marge) started on him. (bắt đầu nhắm vào cậu) This worked quite well, (Điều này hiệu quả khá tốt) though it seemed to give him (mặc dù nó có vẻ mang lại cho cậu) a glazed look, (một cái nhìn đờ đẫn) because Aunt Marge (bởi vì dì Marge) started voicing the opinion (bắt đầu nói lên quan điểm) that he was mentally subnormal. (rằng cậu bị thiểu năng trí tuệ)

At last, at long last, (Cuối cùng, sau bao lâu chờ đợi) the final evening of Marge’s stay (buổi tối cuối cùng trong chuyến thăm của Marge) arrived. (đã đến) Aunt Petunia cooked (Dì Petunia nấu) a fancy dinner (một bữa tối thịnh soạn) and Uncle Vernon uncorked (và dượng Vernon khui) several bottles of wine. (vài chai rượu vang) They got all the way through (Họ đã ăn xong toàn bộ) the soup and the salmon (món súp và món cá hồi) without a single mention (mà không hề có một lời nhắc nhở nào) of Harry’s faults; (về những lỗi lầm của Harry) during the lemon meringue pie, (trong lúc ăn bánh tart chanh trứng đường) Uncle Vernon bored them all (dượng Vernon làm tất cả buồn ngủ) with a long talk (bằng một bài diễn văn dài dòng) about Grunnings, (về Grunnings) his drill-making company; (công ty sản xuất máy khoan của dượng) then Aunt Petunia made coffee (sau đó dì Petunia pha cà phê) and Uncle Vernon brought out (và dượng Vernon mang ra) a bottle of brandy. (một chai rượu brandy)

‘Can I tempt you, Marge?’ (‘Mời em một ly nhé, Marge’)

Aunt Marge had already had (Dì Marge đã uống) rather a lot of wine. (khá nhiều rượu vang) Her huge face (Khuôn mặt to bự của dì) was very red. (đã rất đỏ)

‘Just a small one, then,’ (‘Chỉ một chút thôi nhé’) she chuckled. (dì cười khúc khích) ‘A bit more than that ... (‘Nhiều hơn thế một chút...) and a bit more ... (và thêm một chút nữa...) that’s the boy.’ (thế mới ngoan chứ’)

Dudley was eating (Dudley đang ăn) his fourth slice of pie. (lát bánh thứ tư của nó) Aunt Petunia was sipping coffee (Dì Petunia đang nhâm nhi cà phê) with her little finger (với ngón tay út) sticking out. (chìa ra) Harry really wanted (Harry thực sự muốn) to disappear (biến mất) into his bedroom, (vào phòng ngủ của mình) but he met (nhưng cậu bắt gặp) Uncle Vernon’s angry little eyes (đôi mắt nhỏ giận dữ của dượng Vernon) and knew (và biết) he would have to (mình sẽ phải) sit it out. (ngồi chịu trận cho xong)

‘Aah,’ (‘Aah’) said Aunt Marge, (dì Marge nói) smacking her lips (chép miệng) and putting (và đặt) the empty brandy glass (ly rượu brandy trống rỗng) back down. (xuống lại) ‘Excellent nosh, (‘Đồ ăn ngon tuyệt) Petunia. (Petunia à) It’s normally (Thường thì) just a fry-up (chỉ là một bữa đồ chiên) for me (đối với chị) of an evening, (vào buổi tối) with twelve dogs (với mười hai con chó) to look after ...’ (phải chăm sóc...’) She burped richly (Dì ợ một tiếng rõ to) and patted (và vỗ vỗ) her great tweed stomach. (lên cái bụng mặc áo tweed to bự của mình)

‘Pardon me. (‘Thứ lỗi cho chị) But I do like to see (Nhưng chị rất thích nhìn) a healthy-sized boy,’ (một thằng bé có vóc dáng khỏe mạnh’) she went on, (dì tiếp tục) winking at Dudley. (nháy mắt với Dudley) ‘You’ll be (‘Cháu sẽ là) a proper-sized man, (một người đàn ông lực lưỡng) Dudders, (Dudders à) like your father. (giống như ba cháu) Yes, (Đúng vậy) I’ll have (em sẽ uống) a spot more brandy, (thêm một chút brandy nữa) Vernon ...’ (Vernon...’)

‘Now, (‘Còn) this one here –’ (cái thằng này ở đây –’)

She jerked her head (Dì hất đầu) at Harry, (về phía Harry) who felt (người cảm thấy) his stomach clench. (ruột gan mình thắt lại) The Handbook, (Cuốn Cẩm nang) he thought quickly. (cậu vội nghĩ)

‘This one’s got (‘Thằng này có) a mean, runty look (một vẻ ốm đói, hèn mọn) about him. (toát ra từ nó) You get that (Em cũng thấy điều đó) with dogs. (ở loài chó) I had Colonel Fubster (Em đã bảo Đại tá Fubster) drown one (dìm chết một con) last year. (hồi năm ngoái) Ratty little thing (Một sinh vật nhỏ bé bẩn thỉu) it was. (là nó) Weak. (Yếu ớt) Underbred.’ (Giống tồi’)

Harry was trying (Harry đang cố gắng) to remember (nhớ lại) page twelve (trang mười hai) of his book: (trong cuốn sách của mình) A Charm to Cure (Bùa chú để Chữa) Reluctant Reversers. (Chứng đảo ngược Bất đắc dĩ)

‘It all comes down (‘Tất cả là do) to blood, (huyết thống) as I was saying (như em đã nói) the other day. (hôm nọ) Bad blood (Máu mủ xấu xa) will out. (rồi cũng sẽ lòi ra) Now, (Giờ thì) I’m saying nothing against (chị không có ý chê bai gì) your family, (gia đình em đâu) Petunia’ – (Petunia à’ –) she patted (dì vỗ vỗ) Aunt Petunia’s bony hand (lên bàn tay gầy guộc của dì Petunia) with her shovellike one, (bằng bàn tay to như cái xẻng của mình) ‘but your sister (‘nhưng chị gái em) was a bad egg. (là một kẻ tồi tệ) They turn up (Những kẻ đó xuất hiện) in the best families. (ngay cả trong những gia đình gia giáo nhất) Then she ran off (Rồi cô ta bỏ nhà theo) with a wastrel (một tên vô dụng) and here’s the result (và đây là kết quả) right in front of us.’ (ngay trước mắt chúng ta đây’)

Harry was staring (Harry đang trừng trừng nhìn) at his plate, (vào cái đĩa của mình) a funny ringing (một tiếng ù ù kỳ lạ) in his ears. (trong tai) Grasp your broom firmly (Nắm chặt chổi) by the tail, (ở phần đuôi) he thought. (cậu nghĩ) But he couldn’t remember (Nhưng cậu không thể nhớ ra) what came next. (điều gì tiếp theo) Aunt Marge’s voice (Giọng của dì Marge) seemed to be boring (dường như đang khoan) into him (vào người cậu) like one of (như một trong những) Uncle Vernon’s drills. (cái máy khoan của dượng Vernon)

‘This Potter,’ (‘Tên Potter này’) said Aunt Marge loudly, (dì Marge lớn giọng nói) seizing the brandy bottle (chộp lấy chai rượu brandy) and splashing more (và rót bắn ra ngoài) into her glass (vào ly của mình) and over the tablecloth, (và lên cả khăn trải bàn) ‘you never told me (‘anh chưa bao giờ kể cho em nghe) what he did?’ (hắn làm nghề gì’)

Uncle Vernon and Aunt Petunia (Dượng Vernon và dì Petunia) were looking (trông có vẻ) extremely tense. (vô cùng căng thẳng) Dudley had even looked up (Dudley thậm chí đã ngẩng lên) from his pie (khỏi chiếc bánh của nó) to gape at (để há hốc mồm nhìn) his parents. (ba mẹ nó)

‘He – didn’t work,’ (‘Hắn – không làm việc’) said Uncle Vernon, (dượng Vernon nói) with half a glance (với nửa cái liếc mắt) at Harry. (về phía Harry) ‘Unemployed.’ (‘Thất nghiệp’)

‘As I expected!’ (‘Đúng như em đoán’) said Aunt Marge, (dì Marge nói) taking a huge swig (uống một ngụm lớn) of brandy (rượu brandy) and wiping her chin (và lau cằm) on her sleeve. (bằng tay áo) ‘A no-account, (‘Một kẻ vô tích sự) good-for-nothing, (chẳng được tích sự gì) lazy scrounger (kẻ ăn bám lười biếng) who –’ (kẻ mà –’)

‘He was not,’ (‘Ông ấy không phải vậy’) said Harry suddenly. (Harry đột ngột lên tiếng) The table (Cả bàn ăn) went very quiet. (trở nên im phăng phắc) Harry was shaking (Harry đang run rẩy) all over. (toàn thân) He had never felt (Cậu chưa bao giờ cảm thấy) so angry (tức giận đến thế) in his life. (trong đời)

‘MORE BRANDY!’ (‘THÊM BRANDY NỮA’) yelled Uncle Vernon, (dượng Vernon hét lên) who had gone very white. (người đã tái nhợt cả mặt) He emptied the bottle (Dượng dốc cạn chai rượu) into Aunt Marge’s glass. (vào ly của dì Marge) ‘You, boy,’ (‘Mày, ranh con’) he snarled at Harry. (dượng gầm gừ với Harry) ‘Go to bed, (‘Về phòng ngủ ngay) go on –’ (đi mau –’)

‘No, Vernon,’ (‘Không, Vernon’) hiccoughed Aunt Marge, (dì Marge nấc cục) holding up a hand, (giơ một tay lên) her tiny bloodshot eyes (đôi mắt ti hí hằn tia máu của dì) fixed on Harry’s. (dán chặt vào mắt Harry) ‘Go on, boy, (‘Nói tiếp đi, ranh con) go on. (nói tiếp đi) Proud of your parents, (Tự hào về ba mẹ mày) are you? (phải không) They go and get themselves killed (Họ đâm đầu vào chỗ chết) in a car crash (trong một vụ tai nạn xe hơi) (drunk, I expect) –’ ((chắc là say xỉn, tao đoán thế) –’)

‘They didn’t die (‘Họ không chết) in a car crash!’ (trong một vụ tai nạn xe hơi’) said Harry, (Harry nói) who found himself (người chợt nhận ra mình) on his feet. (đã đứng phắt dậy)

‘They died in a car crash, (‘Họ đã chết trong một vụ tai nạn xe hơi) you nasty little liar, (đồ ranh con dối trá bẩn thỉu) and left you (và bỏ mày lại) to be a burden (thành một gánh nặng) on their decent, (cho những người họ hàng tử tế) hardworking relatives!’ (chăm chỉ của họ’) screamed Aunt Marge, (dì Marge hét lên) swelling with fury. (phồng người lên vì tức giận) ‘You are (‘Mày là) an insolent, (một đứa xấc xược) ungrateful little –’ (vô ơn tệ –’)

But Aunt Marge (Nhưng dì Marge) suddenly stopped speaking. (đột nhiên ngừng bặt) For a moment, (Trong một khoảnh khắc) it looked (trông có vẻ) as though (như thể) words had failed her. (dì không thốt nên lời) She seemed to be swelling (Dì dường như đang phồng lên) with inexpressible anger – (bởi cơn giận không thể tả xiết –) but the swelling (nhưng sự phồng rộp đó) didn’t stop. (không dừng lại) Her great red face (Khuôn mặt đỏ gay to bự của dì) started to expand, (bắt đầu nở to ra) her tiny eyes bulged (đôi mắt ti hí của dì lồi ra) and her mouth stretched (và miệng dì căng ra) too tightly (quá chặt) for speech. (để có thể nói) Next second, (Giây tiếp theo) several buttons burst (vài chiếc cúc áo đứt phăng) from her tweed jacket (khỏi chiếc áo khoác tweed của dì) and pinged off the walls – (và văng vào tường –) she was inflating (dì đang bơm phồng lên) like a monstrous balloon, (như một quả bóng bay quái dị) her stomach bursting free (cái bụng của dì bung ra) of her tweed waistband, (khỏi dải thắt lưng vải tweed) each of her fingers (mỗi ngón tay của dì) blowing up (sưng vù lên) like a salami ... (như một cái xúc xích salami...)

‘MARGE!’ (‘MARGE’) yelled Uncle Vernon and Aunt Petunia (dượng Vernon và dì Petunia hét lên) together, (cùng một lúc) as Aunt Marge’s whole body (khi toàn bộ cơ thể dì Marge) began to rise (bắt đầu nhấc bổng) off her chair (khỏi ghế) towards the ceiling. (hướng lên trần nhà) She was entirely round, (Bây giờ dì đã tròn xoe) now, (ngay lúc này) like a vast life buoy (như một chiếc phao cứu sinh khổng lồ) with piggy eyes, (với đôi mắt lợn) and her hands and feet (và tay chân dì) stuck out weirdly (chìa ra một cách kỳ quái) as she drifted up (khi dì trôi lơ lửng) into the air, (trong không trung) making apoplectic popping noises. (tạo ra những tiếng lụp bụp nghẹn ngào) Ripper came skidding (Con Ripper trượt chân lao) into the room, (vào phòng) barking madly. (sủa điên cuồng)

‘NOOOOOOO!’ (‘KHÔOOOOONG’)

Uncle Vernon seized (Dượng Vernon chộp lấy) one of Marge’s feet (một bàn chân của Marge) and tried to pull her down (và cố gắng kéo dì xuống) again, (lần nữa) but was almost lifted (nhưng chính dượng cũng suýt bị nhấc bổng) from the floor himself. (khỏi mặt sàn) Next second, (Giây tiếp theo) Ripper had leapt forward (con Ripper đã chồm tới) and sunk his teeth (và cắm ngập răng) into Uncle Vernon’s leg. (vào chân dượng Vernon)

Harry tore (Harry lao vụt) from the dining room (khỏi phòng ăn) before anyone could stop him, (trước khi có ai kịp ngăn cậu lại) heading for (hướng tới) the cupboard (bất tủ chứa đồ) under the stairs. (dưới gầm cầu thang) The cupboard door (Cửa tủ chứa đồ) burst magically open (bật mở một cách mầu nhiệm) as he reached it. (khi cậu chạy đến) In seconds, (Trong vài giây) he had heaved (cậu đã kéo) his trunk (cái rương của mình) to the front door. (ra cửa trước) He sprinted upstairs (Cậu chạy nước rút lên lầu) and threw himself (và lao mình) under the bed, (xuống gầm giường) wrenched up (giật tung) the loose floorboard (tấm ván sàn lỏng lẻo) and grabbed (và vồ lấy) the pillowcase (cái vỏ gối) full of his books (đựng đầy sách) and birthday presents. (và quà sinh nhật) He wriggled out, (Cậu trườn ra) seized Hedwig’s empty cage (chộp lấy cái lồng không của Hedwig) and dashed back downstairs (và lao xầm xập xuống lầu) to his trunk, (tới chỗ cái rương của mình) just as (đúng lúc) Uncle Vernon burst out (dượng Vernon lao ra) of the dining room, (khỏi phòng ăn) his trouser leg (ống quần của dượng) in bloody tatters. (rách bươm và đầy máu)

‘COME BACK IN HERE!’ (‘QUAY LẠI ĐÂY NGAY’) he bellowed. (dượng rống lên) ‘COME BACK (‘QUAY LẠI) AND PUT HER RIGHT!’ (VÀ LÀM CHO NÓ BÌNH THƯỜNG LẠI MAU’)

But a reckless rage (Nhưng một cơn thịnh nộ liều lĩnh) had come over Harry. (đã bao trùm lấy Harry) He kicked his trunk open, (Cậu đá tung cái rương) pulled out his wand (rút đũa phép ra) and pointed it (và chĩa nó) at Uncle Vernon. (vào dượng Vernon)

‘She deserved it,’ (‘Bà ta đáng bị như vậy’) Harry said, (Harry nói) breathing very fast. (thở rất gấp) ‘She deserved (‘Bà ta đáng nhận) what she got. (những gì bà ta bị) You keep away (Dượng tránh xa) from me.’ (cháu ra’)

He fumbled (Cậu dò dẫm) behind him (phía sau lưng) for the catch (để tìm cái chốt) on the door. (trên cửa)

‘I’m going,’ (‘Cháu đi đây’) Harry said. (Harry nói) ‘I’ve had enough.’ (‘Cháu chịu đựng đủ rồi’)

And next moment, (Và khoảnh khắc tiếp theo) he was out (cậu đã ở ngoài) in the dark, quiet street, (con phố tối tăm, tĩnh lặng) heaving (kéo lê) his heavy trunk (cái rương nặng trịch) behind him, (phía sau lưng) Hedwig’s cage (cái lồng của Hedwig) under his arm. (kẹp dưới nách)
