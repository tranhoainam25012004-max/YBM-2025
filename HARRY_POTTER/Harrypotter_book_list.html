<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện Harry Potter - Học Tiếng Anh</title>
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2c3e50;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 { color: var(--secondary); font-size: 2.8rem; margin-bottom: 10px; }
        .subtitle { font-size: 1.1rem; color: #7f8c8d; }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .book-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid #eaeaea;
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
            border-color: var(--primary);
        }

        /* Phần mô phỏng bìa sách */
        .book-cover {
            height: 160px;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            font-family: 'Georgia', serif;
            font-weight: bold;
        }

        .book-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .book-vol { font-size: 0.85rem; font-weight: bold; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .book-title-en { font-size: 1.25rem; font-weight: 700; margin-bottom: 5px; line-height: 1.3; }
        .book-title-vi { font-size: 0.95rem; color: #7f8c8d; font-style: italic; margin-bottom: 15px; }
        
        .action-btn {
            margin-top: auto;
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .book-card:hover .action-btn { background: #2980b9; }

        /* Style cho sách chưa ra mắt */
        .book-card.locked { opacity: 0.7; pointer-events: none; filter: grayscale(100%); }
        .book-card.locked .action-btn { background: #bdc3c7; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Thư Viện Phép Thuật</h1>
            <p class="subtitle">Học Tiếng Anh qua 7 tập truyện Harry Potter</p>
        </header>

        <div class="book-grid" id="book-grid">
            </div>
    </div>

    <script>
        // Dữ liệu 7 tập Harry Potter
        const books = [
            { 
                vol: 1, 
                en: "The Sorcerer's Stone", 
                vi: "Hòn đá Phù thủy",
                link: "Harrypotter_book1.html", // Trỏ đến mục lục quyển 1 bạn đã tạo
                status: "available"
            },
            { 
                vol: 2, 
                en: "The Chamber of Secrets", 
                vi: "Phòng chứa Bí mật",
                link: "#", 
                status: "locked" // Đánh dấu là chưa làm xong
            },
            { 
                vol: 3, 
                en: "The Prisoner of Azkaban", 
                vi: "Tên tù nhân ngục Azkaban",
                link: "#", 
                status: "locked"
            },
            { 
                vol: 4, 
                en: "The Goblet of Fire", 
                vi: "Chiếc cốc Lửa",
                link: "#", 
                status: "locked"
            },
            { 
                vol: 5, 
                en: "The Order of the Phoenix", 
                vi: "Hội Phượng hoàng",
                link: "#", 
                status: "locked"
            },
            { 
                vol: 6, 
                en: "The Half-Blood Prince", 
                vi: "Hoàng tử Lai",
                link: "#", 
                status: "locked"
            },
            { 
                vol: 7, 
                en: "The Deathly Hallows", 
                vi: "Bảo bối Tử thần",
                link: "#", 
                status: "locked"
            }
        ];

        const grid = document.getElementById('book-grid');

        books.forEach(book => {
            const card = document.createElement('a');
            // Thêm class 'locked' nếu sách chưa sẵn sàng
            card.className = `book-card ${book.status === 'locked' ? 'locked' : ''}`;
            card.href = book.link;
            
            card.innerHTML = `
                <div class="book-cover">HP${book.vol}</div>
                <div class="book-info">
                    <div class="book-vol">Quyển ${book.vol}</div>
                    <div class="book-title-en">${book.en}</div>
                    <div class="book-title-vi">${book.vi}</div>
                    <div class="action-btn">
                        ${book.status === 'available' ? 'Mở Thư Viện' : 'Đang Cập Nhật...'}
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
