Harry, Ron and Hermione left the castle together, (Harry, Ron và Hermione cùng nhau rời khỏi lâu đài,) crossed the vegetable patch and made for the greenhouses, (băng qua luống rau và đi về phía những ngôi nhà kính,) where the magical plants were kept. (nơi trồng các loài cây ma thuật.) At least the Howler had done one good thing: (Ít nhất thì bức Thư Sấm cũng làm được một việc tốt:) Hermione seemed to think they had now been punished enough (Hermione dường như nghĩ rằng họ giờ đã bị trừng phạt đủ rồi) and was being perfectly friendly again. (và lại tỏ ra hoàn toàn thân thiện.)

It was remarkable how he could show every one of those brilliant teeth (Thật đáng kinh ngạc cái cách ông ta có thể khoe trọn từng chiếc răng sáng chói đó) even when he wasn’t talking. (ngay cả khi ông ta không hề mở miệng.)

‘Gave you a taste for publicity, didn’t I?’ said Lockhart. (‘Đã cho em nếm mùi vị của sự nổi tiếng rồi, phải không?’ Lockhart nói.) ‘Gave you the bug. (‘Đã lây bệnh cho em rồi.) You got onto the front page of the paper with me (Em đã được lên trang nhất của tờ báo cùng với thầy) and you couldn’t wait to do it again.’ (và em đã nóng lòng không thể chờ đợi để được lên báo lần nữa.’)

‘Oh – no, Professor, see –’ (‘Ồ – không đâu thưa Giáo sư, thầy xem –’)

‘Harry, Harry, Harry,’ said Lockhart, (‘Harry, Harry, Harry,’ Lockhart nói,) reaching out and grasping his shoulder. (vươn tay ra và tóm lấy vai cậu.) ‘I understand. (‘Thầy hiểu mà.) Natural to want a bit more (Thật tự nhiên khi muốn thêm một chút nữa) once you’ve had that first taste – (một khi em đã được nếm thử mùi vị đầu tiên đó –) and I blame myself for giving you that, (và thầy tự trách mình vì đã trao nó cho em,) because it was bound to go to your head – (bởi vì nó chắc chắn sẽ khiến em bị ảo tưởng –) but see here, young man, (nhưng nghe đây, chàng trai trẻ,) you can’t start flying cars to try and get yourself noticed. (em không thể bắt đầu lái xe bay chỉ để cố gắng làm cho mình được chú ý.) Just calm down, all right? (Cứ bình tĩnh lại đi, được chứ?) Plenty of time for all that when you’re older. (Còn đầy thời gian cho tất cả những thứ đó khi em lớn hơn.) Yes, yes, I know what you’re thinking! (Có, có, thầy biết em đang nghĩ gì!) “It’s all right for him, he’s an internationally famous wizard already!” (“Thầy ấy nói thì hay lắm, thầy ấy đã là một pháp sư nổi tiếng quốc tế rồi mà!”) But when I was twelve, (Nhưng khi thầy mười hai tuổi,) I was just as much of a nobody as you are now. (thầy cũng chỉ là một kẻ vô danh y như em bây giờ vậy.) In fact, I’d say I was even more of a nobody! (Thực ra, thầy phải nói là thầy còn vô danh hơn thế nữa cơ!) I mean, a few people have heard of you, haven’t they? (Ý thầy là, có vài người đã nghe danh em, phải không?) All that business with He Who Must Not Be Named!’ (Tất cả những vụ lùm xùm với Kẻ-Mà-Ai-Cũng-Biết-Là-Ai đó!’) He glanced at the lightning scar on Harry’s forehead. (Ông ta liếc nhìn vết sẹo tia chớp trên trán Harry.) ‘I know, I know, it’s not quite as good as winning (‘Thầy biết, thầy biết, điều đó không thể nào vẻ vang bằng việc chiến thắng) Witch Weekly’s Most-Charming-Smile Award (Giải thưởng Nụ cười-Quyến rũ-Nhất của Tuần san Phù thủy) five times in a row, as I have – (năm lần liên tiếp, như thầy đã làm –) but it’s a start, Harry, it’s a start.’ (nhưng đó là một sự khởi đầu, Harry à, một sự khởi đầu.’)

He gave Harry a hearty wink and strode off. (Ông ta nháy mắt với Harry một cái đầy thân tình và sải bước bỏ đi.) Harry stood stunned for a few seconds, (Harry đứng sững sờ trong vài giây,) then, remembering he was supposed to be in the greenhouse, (rồi, nhớ ra mình lẽ ra phải đang ở trong nhà kính,) he opened the door and slid inside. (cậu mở cửa và lẻn vào trong.)

Professor Sprout was standing behind a trestle bench (Giáo sư Sprout đang đứng đằng sau một cái băng ghế xếp) in the centre of the greenhouse. (ở giữa nhà kính.) About twenty pairs of different-coloured earmuffs (Khoảng hai mươi chiếc bịt tai với màu sắc khác nhau) were lying on the bench. (đang nằm trên băng ghế.) When Harry had taken his place between Ron and Hermione, (Khi Harry đã vào chỗ của mình giữa Ron và Hermione,) she said, ‘We’ll be re-potting Mandrakes today. (cô nói, ‘Hôm nay chúng ta sẽ thay chậu cho cây Mandrake [Khoai ma].) Now, who can tell me the properties of the Mandrake?’ (Bây giờ, ai có thể cho ta biết các đặc tính của cây Mandrake?’)

To nobody’s surprise, Hermione’s hand was first into the air. (Không có gì ngạc nhiên, tay của Hermione là cánh tay đầu tiên giơ lên không trung.)

‘Mandrake, or Mandragora, is a powerful restorative,’ said Hermione, (‘Cây Mandrake, hay Mandragora, là một loại thuốc phục hồi mạnh mẽ,’ Hermione nói,) sounding as usual as though she had swallowed the textbook. (với giọng điệu như thể cô bé đã nuốt trọn cuốn sách giáo khoa vào bụng như thường lệ.) ‘It is used to return people who have been transfigured or cursed, (‘Nó được dùng để đưa những người đã bị biến hình hoặc bị nguyền rủa,) to their original state.’ (trở lại trạng thái ban đầu của họ.’)

‘Excellent. Ten points to Gryffindor,’ said Professor Sprout. (‘Xuất sắc. Mười điểm cho Gryffindor,’ Giáo sư Sprout nói.) ‘The Mandrake forms an essential part of most antidotes. (‘Cây Mandrake tạo thành một phần thiết yếu của hầu hết các loại thuốc giải độc.) It is also, however, dangerous. (Tuy nhiên, nó cũng rất nguy hiểm.) Who can tell me why?’ (Ai có thể cho ta biết tại sao không?’)

Hermione’s hand narrowly missed Harry’s glasses (Bàn tay của Hermione suýt nữa thì va vào kính của Harry) as it shot up again. (khi nó lại phóng vọt lên.)

‘The cry of the Mandrake is fatal to anyone who hears it,’ she said promptly. (‘Tiếng khóc của cây Mandrake có thể gây tử vong cho bất cứ ai nghe thấy,’ cô bé nhanh nhảu đáp.)

‘Precisely. Take another ten points,’ said Professor Sprout. (‘Chính xác. Nhận thêm mười điểm nữa nhé,’ Giáo sư Sprout nói.) ‘Now, the Mandrakes we have here are still very young.’ (‘Bây giờ, những cây Mandrake mà chúng ta có ở đây vẫn còn rất non.’)

She pointed to a row of deep trays as she spoke (Cô vừa nói vừa chỉ vào một dãy khay sâu) and everyone shuffled forward for a better look. (và mọi người chen chân tiến lên phía trước để nhìn cho rõ hơn.) A hundred or so tufty little plants, purplish green in colour, (Khoảng một trăm cái cây nhỏ mọc thành từng búi, có màu xanh ngả tím,) were growing there in rows. (đang mọc thành từng hàng ở đó.) They looked quite unremarkable to Harry, (Trông chúng khá là bình thường đối với Harry,) who didn’t have the slightest idea (người không mường tượng ra được một chút xíu nào) what Hermione meant by the ‘cry’ of the Mandrake. (về ý của Hermione khi nhắc tới ‘tiếng khóc’ của cây Mandrake.)

‘Everyone take a pair of earmuffs,’ said Professor Sprout. (‘Mỗi người lấy một chiếc bịt tai đi,’ Giáo sư Sprout nói.)

There was a scramble as everyone tried to seize a pair (Có một sự tranh giành hỗn loạn khi mọi người đều cố chộp lấy một chiếc) that wasn’t pink and fluffy. (không phải là màu hồng và phủ đầy lông lá.)

‘When I tell you to put them on, (‘Khi ta bảo các em đeo chúng vào,) make sure your ears are completely covered,’ said Professor Sprout. (hãy đảm bảo là tai của các em được bịt kín hoàn toàn,’ Giáo sư Sprout dặn.) ‘When it is safe to remove them, (‘Khi nào việc tháo chúng ra đã an toàn,) I will give you the thumbs-up. (ta sẽ giơ ngón tay cái lên báo hiệu.) Right – earmuffs on.’ (Được rồi – đeo bịt tai vào.’)

Harry snapped the earmuffs over his ears. (Harry chụp nhanh chiếc bịt tai lên tai mình.) They shut out sound completely. (Chúng hoàn toàn chặn đứng mọi âm thanh.) Professor Sprout put a pink fluffy pair over her own ears, (Giáo sư Sprout đeo một chiếc bịt tai lông lá màu hồng lên tai mình,) rolled up the sleeves of her robes, (xắn tay áo chùng lên,) grasped one of the tufty plants firmly, (nắm chặt lấy một trong những cái cây mọc thành búi đó,) and pulled hard. (và kéo mạnh.)

Harry let out a gasp of surprise that no one could hear. (Harry bật ra một tiếng thở hổn hển vì ngạc nhiên mà chẳng ai có thể nghe thấy.)

Instead of roots, a small, muddy and extremely ugly baby (Thay vì rễ cây, một đứa bé nhỏ xíu, lấm lem bùn đất và cực kỳ xấu xí) popped out of the earth. (bật ra khỏi mặt đất.) The leaves were growing right out of his head. (Những chiếc lá mọc ra ngay từ trên đầu nó.) He had pale green, mottled skin, (Nó có làn da màu xanh nhạt, lốm đốm,) and was clearly bawling at the top of his lungs. (và rõ ràng là đang gào khóc bằng tất cả sức lực của mình.)

Professor Sprout took a large plant pot from under the table (Giáo sư Sprout lấy một cái chậu cây lớn từ dưới gầm bàn) and plunged the Mandrake into it, (và nhét cây Mandrake vào trong đó,) burying him in dark, damp compost (vùi nó trong lớp phân ủ tối màu, ẩm ướt) until only the tufted leaves were visible. (cho đến khi chỉ còn nhìn thấy những chiếc lá mọc thành búi.) Professor Sprout dusted off her hands, (Giáo sư Sprout phủi sạch bụi đất trên tay,) gave them all the thumbs-up (giơ ngón tay cái lên với tất cả bọn họ) and removed her own earmuffs. (và gỡ chiếc bịt tai của chính mình ra.)

‘As our Mandrakes are only seedlings, (‘Vì những cây Mandrake của chúng ta chỉ mới là cây non,) their cries won’t kill yet,’ she said calmly, (nên tiếng khóc của chúng vẫn chưa thể giết người đâu,’ cô bình tĩnh nói,) as though she’d just done nothing more exciting than water a begonia. (như thể cô vừa làm một việc chẳng có gì thú vị hơn là tưới nước cho một chậu thu hải đường.) ‘However, they will knock you out for several hours, (‘Tuy nhiên, chúng sẽ đánh gục các em bất tỉnh trong vài giờ đồng hồ,) and as I’m sure none of you want to miss your first day back, (và vì ta chắc chắn rằng không ai trong số các em muốn bỏ lỡ ngày học đầu tiên của mình,) make sure your earmuffs are securely in place while you work. (hãy đảm bảo bịt tai của các em được giữ chặt đúng vị trí trong lúc làm việc.) I will attract your attention when it is time to pack up. (Ta sẽ thu hút sự chú ý của các em khi đến giờ thu dọn.)

‘Four to a tray – there is a large supply of pots here – (‘Bốn người một khay – có rất nhiều chậu được cung cấp sẵn ở đây –) compost in the sacks over there – (phân ủ thì ở trong mấy cái bao đằng kia –) and be careful of the Venomous Tentacula, it’s teething.’ (và hãy cẩn thận với cây Xúc tu Độc, nó đang mọc răng đấy.’)

She gave a sharp slap to a spiky, dark red plant as she spoke, (Cô vừa nói vừa tát mạnh một cái vào một cái cây màu đỏ sẫm đầy gai nhọn,) making it draw in the long feelers (khiến nó phải rụt những cái vòi xúc giác dài) that had been inching sneakily over her shoulder. (đang lén lút bò nhích dần qua vai cô lại.)

Harry, Ron and Hermione were joined at their tray (Harry, Ron và Hermione được nhập bọn ở khay của mình) by a curly-haired Hufflepuff boy Harry knew by sight, (bởi một cậu bé tóc xoăn nhà Hufflepuff mà Harry quen mặt,) but had never spoken to. (nhưng chưa từng nói chuyện cùng.)

‘Justin Finch-Fletchley,’ he said brightly, shaking Harry by the hand. (‘Justin Finch-Fletchley,’ cậu bé vui vẻ nói, bắt tay Harry.) ‘Know who you are, of course, the famous Harry Potter ... (‘Tất nhiên là mình biết bồ là ai rồi, Harry Potter nổi tiếng ...) and you’re Hermione Granger – always top in everything ...’ (và bồ là Hermione Granger – người luôn đứng đầu trong mọi thứ ...’) (Hermione beamed as she had her hand shaken, too) ( (Hermione cười rạng rỡ khi cũng được cậu ấy bắt tay) ) ‘and Ron Weasley. Wasn’t that your flying car?’ (‘và Ron Weasley. Đó có phải là chiếc xe bay của nhà bồ không?’)

Ron didn’t smile. The Howler was obviously still on his mind. (Ron không cười. Rõ ràng là bức Thư Sấm vẫn còn ám ảnh trong tâm trí cậu.)

‘That Lockhart’s something, isn’t he?’ said Justin happily, (‘Thầy Lockhart đó thật ra gì và này nọ, phải không?’ Justin vui vẻ nói,) as they began filling their plant pots with dragon-dung compost. (khi họ bắt đầu xúc phân rồng ủ đổ vào các chậu cây của mình.) ‘Awfully brave chap. (‘Một người cực kỳ dũng cảm.) Have you read his books? (Các bồ đã đọc sách của thầy ấy chưa?) I’d have died of fear (Mình hẳn đã chết ngất vì sợ hãi) if I’d been cornered in a telephone box by a werewolf, (nếu bị một con người sói dồn vào góc bốt điện thoại,) but he stayed cool and – zap – just fantastic. (nhưng thầy ấy vẫn giữ được bình tĩnh và – pằng – thực sự tuyệt vời.)

‘My name was down for Eton, you know, (‘Tên mình đã được đăng ký vào trường Eton, các bồ biết đấy,) I can’t tell you how glad I am I came here instead. (mình không thể diễn tả được mình vui mừng cỡ nào khi thay vào đó lại đến đây.) Of course, mother was slightly disappointed, (Tất nhiên, mẹ mình có hơi thất vọng một chút,) but since I made her read Lockhart’s books (nhưng kể từ khi mình bắt bà đọc sách của Lockhart) I think she’s begun to see how useful it’ll be (mình nghĩ bà đã bắt đầu nhận ra sẽ hữu ích đến mức nào) to have a fully trained wizard in the family ...’ (khi có một pháp sư được đào tạo bài bản trong gia đình ...’)

After that they didn’t have much chance to talk. (Sau đó, họ không có nhiều cơ hội để nói chuyện.) Their earmuffs were back on and they needed to concentrate on the Mandrakes. (Họ đã đeo lại bịt tai và cần phải tập trung vào những cây Mandrake [Khoai ma].)

Professor Sprout had made it look extremely easy, but it wasn’t. (Giáo sư Sprout đã làm cho việc đó trông cực kỳ dễ dàng, nhưng thực tế thì không phải vậy.) The Mandrakes didn’t like coming out of the earth, but didn’t seem to want to go back into it either. (Những cây Mandrake không thích bị lôi ra khỏi mặt đất, nhưng dường như cũng chẳng muốn chui trở lại vào đó.) They squirmed, kicked, flailed their sharp little fists and gnashed their teeth; (Chúng vặn vẹo, giãy giụa, vung vẩy những nắm đấm nhỏ sắc nhọn và nghiến răng trèo trẹo;) Harry spent ten whole minutes trying to squash a particularly fat one into a pot. (Harry mất trọn mười phút đồng hồ cố gắng nhồi nhét một cây đặc biệt béo múp vào chậu.)

By the end of the class, Harry, like everyone else, was sweaty, aching and covered in earth. (Đến cuối tiết học, Harry, cũng giống như tất cả những người khác, mồ hôi nhễ nhại, đau nhức mình mẩy và người ngợm dính đầy đất cát.) They traipsed back to the castle for a quick wash and then the Gryffindors hurried off to Transfiguration. (Họ uể oải lê bước trở lại lâu đài để tắm rửa qua loa và sau đó đám học sinh nhà Gryffindor hối hả chạy đi học môn Biến hình.)

Professor McGonagall’s classes were always hard work, but today was especially difficult. (Lớp học của Giáo sư McGonagall lúc nào cũng vất vả, nhưng hôm nay lại đặc biệt khó nhằn.) Everything Harry had learned last year seemed to have leaked out of his head during the summer. (Tất cả những gì Harry học được hồi năm ngoái dường như đã rò rỉ hết khỏi đầu cậu trong suốt mùa hè.) He was supposed to be turning a beetle into a button, (Đáng lẽ cậu phải biến một con bọ cánh cứng thành một cái khuy áo,) but all he managed to do was give his beetle a lot of exercise as it scuttled over the desk top avoiding his wand. (nhưng tất cả những gì cậu làm được chỉ là tập thể dục cho con bọ của mình một trận ra trò khi nó chạy hối hả khắp mặt bàn để né tránh đũa phép của cậu.)

Ron was having far worse problems. (Ron thì đang gặp phải những vấn đề tồi tệ hơn nhiều.) He had patched up his wand with some borrowed Spellotape, (Cậu đã chắp vá cây đũa phép của mình bằng một ít Băng keo Phép thuật mượn được,) but it seemed to be damaged beyond repair. (nhưng nó có vẻ như đã hư hỏng đến mức không thể sửa chữa được nữa.) It kept crackling and sparking at odd moments, (Nó liên tục kêu lách tách và xẹt lửa vào những khoảnh khắc bất thình lình,) and every time Ron tried to transfigure his beetle it engulfed him in thick grey smoke which smelled of rotten eggs. (và mỗi lần Ron cố biến hình con bọ của mình nó lại nhấn chìm cậu trong một đám khói xám dày đặc bốc mùi trứng thối.) Unable to see what he was doing, Ron accidentally squashed his beetle with his elbow and had to ask for a new one. (Không thể nhìn thấy mình đang làm gì, Ron vô tình nghiền nát con bọ bằng cùi chỏ và phải xin một con mới.) Professor McGonagall wasn’t pleased. (Giáo sư McGonagall chẳng vui chút nào.)

Harry was relieved to hear the lunch bell. (Harry thở phào nhẹ nhõm khi nghe tiếng chuông báo giờ ăn trưa.) His brain felt like a wrung sponge. (Não cậu có cảm giác như một miếng bọt biển bị vắt kiệt.) Everyone filed out of the classroom except him and Ron, who was whacking his wand furiously on the desk. (Mọi người nối đuôi nhau ra khỏi lớp trừ cậu và Ron, người đang nện đũa phép của mình xuống bàn một cách đầy giận dữ.)

‘Stupid ... useless ... thing ...’ (‘Cái thứ ... vô dụng ... ngu ngốc ...’)

‘Tut, tut – hardly any of you remembered that my favourite colour is lilac. (‘Chậc, chậc – hầu như không ai trong các em nhớ rằng màu sắc yêu thích của thầy là màu hoa tử đinh hương.) I say so in Year with a Yeti. (Thầy đã nói như vậy trong cuốn 'Một năm cùng Người Tuyết Yeti'.) And a few of you need to read Wanderings with Werewolves more carefully – (Và một số em cần phải đọc cuốn 'Lang thang cùng Người Sói' cẩn thận hơn –) I clearly state in chapter twelve that my ideal birthday gift would be harmony between all magic and non-magic peoples – (thầy đã nói rõ trong chương mười hai rằng món quà sinh nhật lý tưởng của thầy sẽ là sự hòa hợp giữa toàn bộ cộng đồng pháp thuật và phi pháp thuật –) though I wouldn’t say no to a large bottle of Ogden’s Old Firewhisky!’ (dù thầy cũng sẽ không chối từ một chai Rượu Whisky Lửa Lão Ogden cỡ lớn đâu!’)

He gave them another roguish wink. (Ông ta lại nháy mắt tinh nghịch với chúng một cái nữa.) Ron was now staring at Lockhart with an expression of disbelief on his face; (Ron lúc này đang trố mắt nhìn Lockhart với một vẻ mặt không thể tin nổi;) Seamus Finnigan and Dean Thomas, who were sitting in front, were shaking with silent laughter. (Seamus Finnigan và Dean Thomas, những người đang ngồi phía trước, đang run lên vì cười nín lặng.) Hermione, on the other hand, was listening to Lockhart with rapt attention, and gave a start when he mentioned her name. (Mặt khác, Hermione lại đang lắng nghe Lockhart với sự chú ý say sưa, và giật mình khi ông ta nhắc đến tên cô bé.)

‘... but Miss Hermione Granger knew my secret ambition is to rid the world of evil and market my own range of hair-care potions – good girl! (‘... nhưng trò Hermione Granger đã biết tham vọng thầm kín của thầy là diệt trừ cái ác trên thế giới và tung ra thị trường dòng độc dược chăm sóc tóc của riêng mình – cô bé ngoan lắm!) In fact –’ he flipped her paper over, ‘full marks! Where is Miss Hermione Granger?’ (Thực tế thì –’ ông ta lật bài kiểm tra của cô bé lại, ‘điểm tối đa! Trò Hermione Granger ở đâu nhỉ?’)

Hermione raised a trembling hand. (Hermione giơ một bàn tay run rẩy lên.)

‘Excellent!’ beamed Lockhart. ‘Quite excellent! Take ten points for Gryffindor! And so, to business ...’ (‘Xuất sắc!’ Lockhart cười rạng rỡ. ‘Thật sự xuất sắc! Nhận mười điểm cho Gryffindor nhé! Và bây giờ, vào việc chính thôi ...’)

He bent down behind his desk and lifted a large, covered cage onto it. (Ông ta cúi xuống phía sau bàn làm việc và nhấc một chiếc lồng lớn, được phủ kín lên đó.)

‘Now – be warned! It is my job to arm you against the foulest creatures known to wizardkind! (‘Bây giờ – hãy cẩn thận! Nhiệm vụ của thầy là trang bị cho các em cách chống lại những sinh vật hôi hám, gớm ghiếc nhất được giới phù thủy biết đến!) You may find yourselves facing your worst fears in this room. (Các em có thể sẽ phải đối mặt với những nỗi sợ hãi tồi tệ nhất của chính mình ngay trong căn phòng này.) Know only that no harm can befall you whilst I am here. All I ask is that you remain calm.’ (Chỉ cần biết rằng không có mối nguy hại nào có thể giáng xuống các em khi thầy còn ở đây. Tất cả những gì thầy yêu cầu là các em phải giữ bình tĩnh.’)

In spite of himself, Harry leaned around his pile of books for a better look at the cage. (Bất giác, Harry nghiêng người qua khỏi chồng sách để nhìn chiếc lồng cho rõ hơn.) Lockhart placed a hand on the cover. (Lockhart đặt một bàn tay lên tấm bạt phủ.) Dean and Seamus had stopped laughing now. Neville was cowering in his front-row seat. (Dean và Seamus giờ đã ngừng cười. Neville đang co rúm lại ở chỗ ngồi hàng ghế đầu của mình.)

‘I must ask you not to scream,’ said Lockhart in a low voice. ‘It might provoke them.’ (‘Thầy phải yêu cầu các em không được la hét,’ Lockhart nói bằng giọng trầm thấp. ‘Việc đó có thể kích động chúng.’)

As the whole class held its breath, Lockhart whipped off the cover. (Trong lúc cả lớp đang nín thở, Lockhart giật tung tấm bạt phủ ra.)

‘Yes,’ he said dramatically. ‘Freshly caught Cornish pixies.’ (‘Đúng vậy,’ ông ta nói đầy kịch tính. ‘Những con yêu tinh xứ Cornwall vừa mới bị bắt.’)

Seamus Finnigan couldn’t control himself. (Seamus Finnigan không thể kiềm chế được mình.) He let out a snort of laughter which even Lockhart couldn’t mistake for a scream of terror. (Cậu bật ra một tiếng phì cười mà ngay cả Lockhart cũng không thể lầm tưởng thành một tiếng hét kinh hoàng được.)

‘Yes?’ he smiled at Seamus. (‘Sao vậy?’ ông ta mỉm cười với Seamus.)

‘Well, they’re not – they’re not very – dangerous, are they?’ Seamus choked. (‘Dạ, chúng không – chúng không được – nguy hiểm cho lắm, phải không ạ?’ Seamus cười sặc sụa.)

‘Don’t be so sure!’ said Lockhart, waggling a finger annoyingly at Seamus. (‘Đừng quá chắc chắn như vậy!’ Lockhart nói, quơ quơ một ngón tay một cách khó chịu về phía Seamus.) ‘Devilish tricky little blighters they can be!’ (‘Chúng có thể là những con quỷ nhỏ cực kỳ quỷ quyệt đấy!’)

The pixies were electric blue and about eight inches high, (Những con yêu tinh có màu xanh lơ chói lọi và cao khoảng tám inch,) with pointed faces and voices so shrill it was like listening to a lot of budgies arguing. (với những khuôn mặt nhọn hoắt và giọng nói the thé nghe như thể đang nghe một bầy vẹt yến phụng cãi lộn vậy.) The moment the cover had been removed, they had started jabbering and rocketing around, (Ngay khoảnh khắc tấm bạt phủ được gỡ bỏ, chúng đã bắt đầu chí chóe và lao vun vút xung quanh,) rattling the bars and pulling bizarre faces at the people nearest them. (rung lắc các chấn song và làm ra những khuôn mặt kỳ dị trêu chọc những người ở gần chúng nhất.)

‘Right then,’ Lockhart said loudly. ‘Let’s see what you make of them!’ And he opened the cage. (‘Được rồi,’ Lockhart lớn giọng. ‘Hãy xem các em làm gì được với chúng nhé!’ Và ông ta mở tung lồng ra.)

It was pandemonium. (Thật là một mớ hỗn độn chói tai.) The pixies shot in every direction like rockets. (Đám yêu tinh bắn túa đi mọi hướng như những quả rocket.) Two of them seized Neville by the ears and lifted him into the air. (Hai con tóm lấy tai Neville và nhấc bổng cậu lên không trung.) Several shot straight through the window, showering the back row with broken glass. (Vài con bắn thẳng qua cửa sổ, tưới một cơn mưa mảnh kính vỡ lên hàng ghế cuối.) The rest proceeded to wreck the classroom more effectively than a rampaging rhino. (Số còn lại bắt tay vào việc phá nát lớp học hiệu quả hơn cả một con tê giác đang nổi điên.) They grabbed ink bottles and sprayed the class with them, shredded books and papers, tore pictures from the walls, upended the waste bin, (Chúng chộp lấy những lọ mực và xịt tung tóe khắp lớp, xé nát bươm sách vở và giấy tờ, giật tung các bức tranh khỏi tường, lật úp thùng rác,) grabbed bags and books and threw them out of the smashed window; (chộp lấy cặp táp và sách vở rồi ném thẳng ra ngoài qua ô cửa sổ đã vỡ nát;) within minutes, half the class was sheltering under desks and Neville was swinging from the candelabra in the ceiling. (chỉ trong vài phút, một nửa lớp đã phải chui rúc trốn dưới gầm bàn và Neville thì đang đu tòn ten trên cái giá nến treo trên trần nhà.)

‘Come on now, round them up, round them up, they’re only pixies ...’ Lockhart shouted. (‘Nào các em, lùa chúng lại, gom chúng lại đi, chúng chỉ là yêu tinh thôi mà ...’ Lockhart hét lên.)

He rolled up his sleeves, brandished his wand and bellowed, ‘Peskipiksi Pesternomi!’ (Ông ta xắn tay áo lên, vung đũa phép và gầm lên, ‘Peskipiksi Pesternomi!’)

It had absolutely no effect; (Nó hoàn toàn chẳng có tác dụng gì;) one of the pixies seized Lockhart’s wand and threw it out of the window, too. (một trong những con yêu tinh đã chộp lấy đũa phép của Lockhart và cũng ném luôn nó ra ngoài cửa sổ.) Lockhart gulped and dived under his own desk, (Lockhart nuốt cái ực và lặn vội xuống gầm bàn của mình,) narrowly avoiding being squashed by Neville, who fell a second later as the candelabra gave way. (tránh trong gang tấc việc bị đè bẹp bởi Neville, người đã rơi phịch xuống một giây sau đó do giá nến bị gãy gập.)

The bell rang and there was a mad rush towards the exit. (Tiếng chuông reo lên và có một cuộc tháo chạy điên cuồng về phía lối ra.) In the relative calm that followed, Lockhart straightened up, (Trong sự tĩnh lặng tương đối theo sau đó, Lockhart đứng thẳng lên,) caught sight of Harry, Ron and Hermione, who were almost at the door, (bắt gặp ánh mắt của Harry, Ron và Hermione, những người gần như đã ra tới cửa,) and said, ‘Well, I’ll ask you three to just nip the rest of them back into their cage.’ (và nói, ‘Chà, thầy sẽ nhờ ba em tóm nốt những con còn lại cho lại vào lồng nhé.’) He swept past them and shut the door quickly behind him. (Ông ta lao vụt qua họ và nhanh chóng đóng sầm cửa lại phía sau lưng.)

‘Can you believe him?’ roared Ron, (‘Bồ có tin nổi ổng không?’ Ron gầm lên,) as one of the remaining pixies bit him painfully on the ear. (khi một trong những con yêu tinh còn sót lại cắn một cú đau điếng vào tai cậu.)

‘He just wants to give us some hands-on experience,’ said Hermione, (‘Thầy ấy chỉ muốn cho tụi mình một chút kinh nghiệm thực hành thôi,’ Hermione nói,) immobilising two pixies at once with a clever Freezing Charm (làm tê liệt hai con yêu tinh cùng lúc bằng một Bùa Đóng băng khéo léo) and stuffing them back into their cage. (và nhồi nhét chúng trở lại vào lồng.)

‘Hands on?’ said Harry, (‘Thực hành á?’ Harry nói,) who was trying to grab a pixie dancing out of reach with its tongue out. (người đang cố gắng chộp lấy một con yêu tinh đang nhảy nhót ngoài tầm với và thè lưỡi ra trêu tức.) ‘Hermione, he didn’t have a clue what he was doing.’ (‘Hermione à, ổng hoàn toàn chẳng biết ổng đang làm cái quái gì đâu.’)

‘Rubbish,’ said Hermione. (‘Nói bậy,’ Hermione nói.) ‘You’ve read his books – (‘Hai bồ đã đọc sách của thầy ấy rồi mà –) look at all those amazing things he’s done ...’ (hãy nhìn vào tất cả những điều tuyệt vời thầy ấy đã làm xem ...’)

‘He says he’s done,’ Ron muttered. (‘Là ổng TỰ NÓI ổng đã làm thôi,’ Ron lầm bầm.)
