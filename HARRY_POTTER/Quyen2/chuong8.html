‘My dear friends,’ he said mournfully, (‘Những người bạn yêu quý của ta,’ ông thê lương nói,) ‘welcome, welcome ... so pleased you could come ...’ (‘chào mừng, chào mừng ... rất vui vì các cháu đã có thể đến ...’)

He swept off his plumed hat and bowed them inside. (Ông quét chiếc mũ đính lông chim của mình xuống và cúi chào mời họ vào trong.)

It was an incredible sight. (Đó là một cảnh tượng khó tin.) The dungeon was full of hundreds of pearly-white, translucent people, (Căn hầm ngầm chứa đầy hàng trăm người trắng như ngọc trai, trong suốt mờ ảo,) mostly drifting around a crowded dance floor, (phần lớn đang trôi dạt quanh một sàn khiêu vũ đông đúc,) waltzing to the dreadful, quavering sound of thirty musical saws, (đang nhảy điệu valse trong âm thanh khủng khiếp, run rẩy của ba mươi cái cưa nhạc,) played by an orchestra on a black-draped platform. (được chơi bởi một ban nhạc trên một bục bọc vải đen.) A chandelier overhead blazed midnight blue with a thousand more black candles. (Một chiếc đèn chùm trên đỉnh đầu tỏa sáng rực rỡ màu xanh đen với cả ngàn ngọn nến đen khác.) Their breath rose in a mist before them; (Hơi thở của họ bốc lên thành sương mù ngay trước mặt;) it was like stepping into a freezer. (cảm giác giống như bước vào một cái tủ đông vậy.)

‘Shall we have a look around?’ Harry suggested, (‘Chúng ta đi dạo một vòng nhé?’ Harry gợi ý,) wanting to warm up his feet. (muốn làm ấm đôi chân của mình.)

‘Careful not to walk through anyone,’ said Ron nervously, (‘Cẩn thận đừng đi xuyên qua người ai nhé,’ Ron lo lắng dặn,) and they set off around the edge of the dance floor. (và họ bắt đầu đi vòng quanh rìa sàn khiêu vũ.) They passed a group of gloomy nuns, (Họ đi ngang qua một nhóm các bà sơ sầu thảm,) a ragged man wearing chains, (một người đàn ông rách rưới đeo xiềng xích,) and the Fat Friar, a cheerful Hufflepuff ghost, (và Thầy tu Béo, con ma vui vẻ của nhà Hufflepuff,) who was talking to a knight with an arrow sticking out of his forehead. (người đang nói chuyện với một hiệp sĩ có một mũi tên cắm ngập trên trán.) Harry wasn’t surprised to see that the Bloody Baron, (Harry không ngạc nhiên khi thấy Nam tước Đẫm máu,) a gaunt, staring Slytherin ghost covered in silver bloodstains, (con ma hốc hác, luôn trừng trừng mắt của nhà Slytherin dính đầy những vết máu màu bạc,) was being given a wide berth by the other ghosts. (đang bị những con ma khác tránh né tạo thành một khoảng trống lớn xung quanh.)

‘Oh no,’ said Hermione, stopping abruptly. (‘Ôi không,’ Hermione nói, đột ngột dừng lại.) ‘Turn back, turn back, I don’t want to talk to Moaning Myrtle –’ (‘Quay lại, quay lại đi, mình không muốn nói chuyện với Myrtle Khóc nhè đâu –’)

‘Who?’ said Harry, as they backtracked quickly. (‘Ai cơ?’ Harry hỏi, trong khi họ nhanh chóng lùi lại.)

‘She haunts the girls’ toilet on the first floor,’ said Hermione. (‘Nhỏ đó ám cái nhà vệ sinh nữ trên lầu một,’ Hermione nói.)

‘She haunts a toilet?’ (‘Nhỏ đó ám một cái nhà vệ sinh á?’)

‘Yes. It’s been out of order all year (‘Ừ. Nó đã bị hỏng cả năm nay rồi) because she keeps having tantrums and flooding the place. (bởi vì nhỏ đó cứ liên tục nổi cơn thịnh nộ và làm ngập nước chỗ đó.) I never went in there anyway if I could avoid it, (Dù sao thì mình cũng chẳng bao giờ vào đó nếu có thể tránh được,) it’s awful trying to go to the loo with her wailing at you –’ (thật kinh khủng khi đang cố đi vệ sinh mà lại có người than khóc ỉ ôi với bồ –’)

‘Look, food!’ said Ron. (‘Nhìn kìa, đồ ăn!’ Ron nói.)

On the other side of the dungeon was a long table, (Ở phía bên kia căn hầm là một chiếc bàn dài,) also covered in black velvet. (cũng được phủ nhung đen.) They approached it eagerly, (Họ háo hức tiến lại gần,) but next moment had stopped in their tracks, horrified. (nhưng ngay khoảnh khắc tiếp theo đã khựng lại, kinh hãi.) The smell was quite disgusting. (Mùi bốc lên thật khá kinh tởm.) Large, rotten fish were laid on handsome silver platters; (Những con cá lớn, thối rữa được đặt trên những cái mâm bạc đẹp đẽ;) cakes, burned charcoal black, were heaped on salvers; (những cái bánh ngọt, cháy đen như than, được chất thành đống trên khay;) there was a great maggoty haggis, (có một cái dạ dày cừu nhồi khổng lồ lúc nhúc giòi bọ,) a slab of cheese covered in furry green mould (một tảng phô mai phủ đầy nấm mốc xanh rêu lông lá) and, in pride of place, an enormous grey cake in the shape of a tombstone, (và, ở vị trí trang trọng nhất, một chiếc bánh kem màu xám khổng lồ có hình dáng của một tấm bia mộ,) with tar-like icing forming the words, (với lớp kem phủ giống như nhựa đường tạo thành những dòng chữ,)

Sir Nicholas de Mimsy-Porpington (Ngài Nicholas de Mimsy-Porpington)

died 31st October, 1492 (mất ngày 31 tháng 10 năm 1492)

Harry watched, amazed, (Harry kinh ngạc theo dõi,) as a portly ghost approached the table, (khi một con ma phục phịch tiến đến cái bàn,) crouched low and walked through it, (cúi thấp xuống và đi xuyên qua nó,) his mouth held wide so that it passed through one of the stinking salmon. (miệng ông há hốc ra sao cho nó đi xuyên qua một trong những con cá hồi bốc mùi hôi thối.)

‘Can you taste it if you walk through it?’ Harry asked him. (‘Bác có nếm được nó nếu đi xuyên qua nó không ạ?’ Harry hỏi ông.)

‘Almost,’ said the ghost sadly, and he drifted away. (‘Gần như thế,’ con ma buồn bã nói, và trôi dạt ra xa.)

‘I expect they’ve let it rot to give it a stronger flavour,’ said Hermione knowledgeably, (‘Mình cho là họ đã để nó thối rữa ra để có hương vị đậm đà hơn,’ Hermione ra vẻ hiểu biết nói,) pinching her nose and leaning closer to look at the putrid haggis. (bịt mũi lại và cúi sát vào để nhìn cái dạ dày cừu thối rữa.)

‘Can we move? I feel sick,’ said Ron. (‘Tụi mình đi chỗ khác được không? Mình thấy buồn nôn quá,’ Ron nói.)

They had barely turned around, however, (Tuy nhiên, họ vừa mới quay người lại,) when a little man swooped suddenly from under the table (thì một người đàn ông nhỏ thó đột nhiên sà ra từ dưới gầm bàn) and came to a halt in mid-air before them. (và khựng lại giữa không trung ngay trước mặt họ.)

‘Hello, Peeves,’ said Harry cautiously. (‘Chào, Peeves,’ Harry dè chừng lên tiếng.)

Unlike the ghosts around them, (Không giống như những con ma xung quanh họ,) Peeves the poltergeist was the very reverse of pale and transparent. (con yêu tinh rắc rối Peeves hoàn toàn trái ngược với vẻ nhợt nhạt và trong suốt.) He was wearing a bright orange party hat, (Hắn đang đội một chiếc mũ dự tiệc màu cam sáng,) a revolving bow-tie (một cái nơ xoay tít) and a broad grin on his wide, wicked face. (và một nụ cười toe toét trên khuôn mặt rộng bản, độc ác của hắn.)

‘Nibbles?’ he said sweetly, (‘Nhấm nháp chút gì không?’ hắn ngọt ngào nói,) offering them a bowl of peanuts covered in fungus. (mời họ một bát đậu phộng phủ đầy nấm mốc.)

‘No thanks,’ said Hermione. (‘Không, cảm ơn,’ Hermione nói.)

‘Heard you talking about poor Myrtle,’ said Peeves, his eyes dancing. (‘Nghe thấy tụi bây đang nói về con Myrtle tội nghiệp nha,’ Peeves nói, đôi mắt hắn nhảy múa.) ‘Rude you was about poor Myrtle.’ (‘Tụi bây đã rất thô lỗ với con Myrtle tội nghiệp nha.’) He took a deep breath and bellowed, ‘OY! MYRTLE!’ (Hắn hít một hơi thật sâu và rống lên, ‘Ế! MYRTLE!’)

‘Oh, no, Peeves, don’t tell her what I said, she’ll be really upset,’ Hermione whispered frantically. (‘Ôi, không, Peeves, đừng nói với nhỏ đó những gì tôi đã nói, nhỏ sẽ rất buồn đấy,’ Hermione hoảng hốt thì thầm.) ‘I didn’t mean it, I don’t mind her – er, hello, Myrtle.’ (‘Tôi không cố ý, tôi không ghét nhỏ đâu – ờ, chào, Myrtle.’)

The squat ghost of a girl had glided over. (Con ma thấp lùn của một cô gái vừa lướt tới.) She had the glummest face Harry had ever seen, (Cô nàng mang một khuôn mặt u ám nhất mà Harry từng thấy,) half-hidden behind lank hair and thick, pearly spectacles. (bị che khuất một nửa đằng sau mái tóc thẳng đuột rũ rượi và cặp kính dày cộp, màu ngọc trai.)

‘What?’ she said sulkily (‘Gì?’ cô nàng rầu rĩ hỏi)

‘How are you, Myrtle?’ said Hermione, in a falsely bright voice. (‘Bồ khỏe không, Myrtle?’ Hermione cất giọng lanh lảnh giả tạo.) ‘It’s nice to see you out of the toilet.’ (‘Thật vui khi thấy bồ ra khỏi nhà vệ sinh.’)

Myrtle sniffed. (Myrtle sụt sịt.)

‘Miss Granger was just talking about you –’ said Peeves slyly in Myrtle’s ear. (‘Trò Granger vừa mới nói về mày đó –’ Peeves ranh mãnh nói vào tai Myrtle.)

‘Just saying – saying – how nice you look tonight,’ said Hermione, glaring at Peeves. (‘Chỉ là nói – nói – đêm nay bồ trông đẹp làm sao,’ Hermione nói, trừng mắt nhìn Peeves.)

Myrtle eyed Hermione suspiciously. (Myrtle nhìn Hermione đầy nghi ngờ.)

‘You’re making fun of me,’ she said, (‘Bồ đang chế nhạo mình,’ cô nàng nói,) silver tears welling rapidly in her small, see-through eyes. (những giọt nước mắt màu bạc nhanh chóng ứa ra trong đôi mắt nhỏ bé, nhìn xuyên thấu của nàng.)

‘No – honestly – didn’t I just say how nice Myrtle’s looking?’ said Hermione, (‘Không – thật đấy – chẳng phải mình vừa nói là Myrtle trông rất tuyệt sao?’ Hermione nói,) nudging Harry and Ron painfully in the ribs. (thúc cùi chỏ đau điếng vào mạn sườn Harry và Ron.)

‘Oh, yeah ...’ (‘À, ừ ...’)

‘She did ...’ (‘Bồ ấy đã nói thế ...’)

‘Don’t lie to me,’ Myrtle gasped, (‘Đừng có nói dối tôi,’ Myrtle nấc lên,) tears now flooding down her face, (nước mắt giờ đã giàn giụa trên mặt nàng,) while Peeves chuckled happily over her shoulder. (trong khi Peeves cười khúc khích sung sướng qua vai nàng.) ‘D’you think I don’t know what people call me behind my back? (‘Mấy người tưởng tôi không biết người ta gọi tôi là gì sau lưng sao?) Fat Myrtle! Ugly Myrtle! (Myrtle Mập ú! Myrtle Xấu xí!) Miserable, moaning, moping Myrtle!’ (Myrtle Sầu thảm, mếu máo, rên rỉ than vãn!’)

‘You’ve missed out “spotty”,’ Peeves hissed in her ear. (‘Mày bỏ sót từ “mụn nhọt” rồi,’ Peeves rít lên bên tai nàng.)

Moaning Myrtle burst into anguished sobs and fled from the dungeon. (Myrtle Khóc nhè òa lên những tiếng nức nở đau khổ và bỏ chạy khỏi hầm ngầm.) Peeves shot after her, pelting her with mouldy peanuts, yelling, ‘Spotty! Spotty!’ (Peeves lao theo nàng, chọi những hạt đậu phộng mốc meo vào nàng, hét lớn, ‘Mụn nhọt! Mụn nhọt!’)

‘Oh, dear,’ said Hermione sadly. (‘Ôi, trời ạ,’ Hermione buồn bã nói.)

Nearly Headless Nick now drifted towards them through the crowd. (Nick Suýt Mất Đầu lúc này trôi dạt về phía họ xuyên qua đám đông.)

‘Enjoying yourselves?’ (‘Các cháu đang vui chứ?’)

‘Oh, yes,’ they lied. (‘Ồ, vâng ạ,’ họ nói dối.)

‘Not a bad turnout,’ said Nearly Headless Nick proudly. (‘Số lượng khách tham dự không tồi,’ Nick Suýt Mất Đầu tự hào nói.) ‘The Wailing Widow came all the way up from Kent ... (‘Góa phụ Than khóc đã cất công đến từ tận Kent ...) It’s nearly time for my speech, I’d better go and warn the orchestra ...’ (Sắp đến giờ ta đọc diễn văn rồi, ta tốt hơn nên đi báo cho ban nhạc chuẩn bị ...’)

The orchestra, however, stopped playing at that very moment. (Tuy nhiên, ban nhạc đã ngừng chơi đúng vào lúc đó.) They, and everyone else in the dungeon, fell silent, (Họ, và tất cả mọi người khác trong hầm ngầm, đều im lặng,) looking around in excitement, as a hunting horn sounded. (phấn khích nhìn quanh, khi một tiếng tù và săn bắn vang lên.)

‘Oh, here we go,’ said Nearly Headless Nick bitterly. (‘Ôi, lại bắt đầu rồi đây,’ Nick Suýt Mất Đầu cay đắng nói.)

Through the dungeon wall burst a dozen ghost horses, (Xuyên qua bức tường hầm ngầm, một tá ngựa ma lao xộc vào,) each ridden by a headless horseman. (mỗi con được cưỡi bởi một kỵ sĩ không đầu.) The assembly clapped wildly; (Toàn thể khách dự tiệc vỗ tay rào rào;) Harry started to clap too, but stopped quickly at the sight of Nick’s face. (Harry cũng bắt đầu vỗ tay, nhưng dừng lại ngay khi nhìn thấy vẻ mặt của Nick.)

The horses galloped into the middle of the dance floor and halted, rearing and plunging; (Bầy ngựa phi nước đại vào giữa sàn khiêu vũ và dừng lại, chồm hai chân trước lên và hất tung mình;) a large ghost at the front, (một con ma to lớn ở phía trước,) whose bearded head was under his arm, blowing the horn, leapt down, (với cái đầu rậm râu đang kẹp dưới nách để thổi tù và, nhảy xuống,) lifted his head high in the air so he could see over the crowd (giơ cái đầu của ông ta lên cao không trung để có thể nhìn bao quát đám đông) (everyone laughed) ( (mọi người đều cười lớn) ) and strode over to Nearly Headless Nick, squashing his head back onto his neck. (và sải bước tiến tới chỗ Nick Suýt Mất Đầu, nhồi cái đầu của ông ta trở lại lên cổ.)

‘Nick!’ he roared. ‘How are you? Head still hanging in there?’ (‘Nick!’ ông ta gầm lên. ‘Ông khỏe không? Cái đầu vẫn còn dính lủng lẳng ở đó chứ?’)

He gave a hearty guffaw and clapped Nearly Headless Nick on the shoulder. (Ông ta phá lên cười hô hố sảng khoái và vỗ vai Nick Suýt Mất Đầu cái bộp.)

‘Welcome, Patrick,’ said Nick stiffly. (‘Chào mừng, Patrick,’ Nick cứng nhắc đáp.)

‘Live ’uns!’ said Sir Patrick, (‘Những kẻ còn sống!’ Ngài Patrick nói,) spotting Harry, Ron and Hermione (phát hiện ra Harry, Ron và Hermione) and giving a huge, fake jump of astonishment, (và làm một cú giật nảy mình giả tạo kinh ngạc,) so that his head fell off again (the crowd howled with laughter). (đến mức cái đầu của ông lại rớt xuống lần nữa (đám đông rú lên cười).)

‘Very amusing,’ said Nearly Headless Nick darkly. (‘Rất buồn cười,’ Nick Suýt Mất Đầu u ám nói.)

‘Don’t mind Nick!’ shouted Sir Patrick’s head from the floor. (‘Đừng bận tâm đến Nick!’ cái đầu của Ngài Patrick hét lên từ dưới sàn.) ‘Still upset we won’t let him join the Hunt! (‘Vẫn còn bực tức vì chúng ta không cho ông ấy gia nhập Hội Săn đây mà!) But I mean to say – look at the fellow –’ (Nhưng ý ta là – thử nhìn anh bạn đó xem –’)

‘I think,’ said Harry hurriedly, at a meaningful look from Nick, (‘Cháu nghĩ,’ Harry vội vàng nói, bắt được cái nhìn đầy ngụ ý từ Nick,) ‘Nick’s very – frightening and – er –’ (‘bác Nick rất – đáng sợ và – ờ –’)

‘Ha!’ yelled Sir Patrick’s head. ‘Bet he asked you to say that!’ (‘Ha!’ cái đầu của Ngài Patrick hét lớn. ‘Cá là ông ấy đã nhờ nhóc nói vậy!’)

‘If I could have everyone’s attention, it’s time for my speech!’ said Nearly Headless Nick loudly, (‘Xin mọi người chú ý, đã đến giờ tôi đọc diễn văn!’ Nick Suýt Mất Đầu lớn giọng nói,) striding towards the podium and climbing into an icy-blue spotlight. (sải bước tiến về phía bục phát biểu và bước vào một vệt sáng màu xanh băng giá.)

‘My late lamented lords, ladies and gentlemen, it is my great sorrow ...’ (‘Kính thưa các quý ngài, quý bà và quý vị đã khuất vô vàn thương tiếc của tôi, tôi vô cùng sầu muộn ...’)

But nobody heard much more. (Nhưng không ai nghe thêm được gì nhiều.) Sir Patrick and the rest of the Headless Hunt had just started a game of Head Hockey (Ngài Patrick và phần còn lại của Hội Săn Đầu Người vừa mới bắt đầu một trận Khúc côn cầu bằng Đầu) and the crowd were turning to watch. (và đám đông đang quay sang để xem.) Nearly Headless Nick tried vainly to recapture his audience, (Nick Suýt Mất Đầu cố gắng giành lại thính giả của mình trong vô vọng,) but gave up as Sir Patrick’s head went sailing past him to loud cheers. (nhưng đã bỏ cuộc khi cái đầu của Ngài Patrick bay vút ngang qua ông trong những tiếng reo hò ầm ĩ.)

Harry was very cold by now, not to mention hungry. (Harry lúc này đã rất lạnh, đó là chưa kể đến việc bụng đang đói meo.)

‘I can’t stand much more of this,’ Ron muttered, his teeth chattering, (‘Mình không thể chịu đựng thêm chuyện này được nữa,’ Ron lầm bầm, hai hàm răng đánh bò cạp vào nhau,) as the orchestra ground back into action and the ghosts swept back onto the dance floor. (khi ban nhạc bắt đầu chơi lại và những con ma lướt trở lại sàn khiêu vũ.)

‘Let’s go,’ Harry agreed. (‘Đi thôi,’ Harry đồng ý.)

They backed towards the door, (Họ lùi dần về phía cửa,) nodding and beaming at anyone who looked at them, (gật đầu và mỉm cười rạng rỡ với bất kỳ ai nhìn họ,) and a minute later were hurrying back up the passageway full of black candles. (và một phút sau đang hối hả trở ngược lên hành lang chứa đầy những ngọn nến đen.)

‘Pudding might not be finished yet,’ said Ron hopefully, (‘Có khi món bánh pudding vẫn chưa hết đâu,’ Ron đầy hy vọng nói,) leading the way towards the steps to the Entrance Hall. (dẫn đầu tiến về phía những bậc thang lên Tiền sảnh.)

And then Harry heard it. (Và rồi Harry nghe thấy nó.)

‘... rip ... tear ... kill ...’ (‘... xé ... cắn nát ... giết ...’)

It was the same voice, the same cold, murderous voice he had heard in Lockhart’s office. (Đó là cùng một giọng nói, cùng cái giọng nói lạnh lẽo, đầy sát khí mà cậu đã nghe thấy trong văn phòng của Lockhart.)

He stumbled to a halt, clutching at the stone wall, (Cậu lảo đảo khựng lại, bấu chặt vào bức tường đá,) listening with all his might, looking around, (vểnh tai lắng nghe bằng tất cả sức lực, nhìn quanh,) squinting up and down the dimly lit passageway. (nheo mắt ngó dọc ngó ngang hành lang được thắp sáng lờ mờ.)

‘Harry, what’re you –?’ (‘Harry, bồ đang –?’)

‘It’s that voice again – shut up a minute –’ (‘Lại cái giọng nói đó – im lặng một phút coi –’)

‘... soo hungry ... for so long ...’ (‘... quá đói ... đã quá lâu ...’)

‘Listen!’ said Harry urgently, and Ron and Hermione froze, watching him. (‘Nghe này!’ Harry khẩn trương nói, và Ron cùng Hermione chết trân tại chỗ, nhìn cậu.)

‘... kill ... time to kill ...’ (‘... giết ... đã đến lúc giết ...’)

The voice was growing fainter. (Giọng nói ngày càng nhỏ dần.) Harry was sure it was moving away – moving upwards. (Harry chắc chắn là nó đang di chuyển ra xa – di chuyển lên trên.) A mixture of fear and excitement gripped him as he stared at the dark ceiling; (Một sự pha trộn giữa sợ hãi và phấn khích xâm chiếm cậu khi cậu nhìn chằm chằm lên trần nhà tối đen;) how could it be moving upwards? (làm sao nó có thể di chuyển lên trên được chứ?) Was it a phantom, to whom stone ceilings didn’t matter? (Đó là một bóng ma, kẻ mà các trần nhà bằng đá chẳng là nghĩa lý gì sao?)

‘This way,’ he shouted, and he began to run, up the stairs, into the Entrance Hall. (‘Lối này,’ cậu hét lên, và cậu bắt đầu chạy, lên cầu thang, vào Tiền sảnh.) It was no good hoping to hear anything here, (Chẳng có hy vọng gì nghe được thứ gì ở đây,) the babble of talk from the Hallowe’en feast was echoing out of the Great Hall. (tiếng xì xầm trò chuyện từ bữa tiệc Halloween đang vang vọng ra từ Đại sảnh đường.) Harry sprinted up the marble staircase to the first floor, Ron and Hermione clattering behind him. (Harry chạy nước rút lên cầu thang đá cẩm thạch lên lầu một, Ron và Hermione chạy lạch cạch theo sau.)

‘Harry, what are we –’ (‘Harry, chúng ta đang –’)

‘SHH!’ (‘SUỴT!’)

Harry strained his ears. (Harry căng tai ra nghe.) Distantly, from the floor above, and growing fainter still, he heard the voice: (Từ xa xăm, từ tầng trên, và đang nhỏ dần đi, cậu nghe thấy giọng nói đó:) ‘... I smell blood ... I SMELL BLOOD!’ (‘... Tao ngửi thấy mùi máu ... TAO NGỬI THẤY MÙI MÁU!’)

His stomach lurched. ‘It’s going to kill someone!’ he shouted, (Dạ dày cậu quặn lại. ‘Nó định giết ai đó!’ cậu hét lên,) and ignoring Ron and Hermione’s bewildered faces, (và mặc kệ vẻ mặt hoang mang của Ron và Hermione,) he ran up the next flight of steps three at a time, (cậu chạy vọt lên nhịp cầu thang tiếp theo ba bậc một lúc,) trying to listen over his own pounding footsteps. (cố gắng lắng nghe át đi tiếng bước chân thình thịch của chính mình.)

Harry hurtled around the whole of the second floor, (Harry lao vút quanh toàn bộ tầng hai,) Ron and Hermione panting behind him, (Ron và Hermione vừa chạy vừa thở hổn hển theo sau cậu,) not stopping until they turned a corner into the last, deserted passage. (không dừng lại cho đến khi họ rẽ qua một góc vào dãy hành lang vắng vẻ cuối cùng.)

‘Harry, what was that all about?’ said Ron, wiping sweat off his face. ‘I couldn’t hear anything ...’ (‘Harry, chuyện đó là sao vậy?’ Ron hỏi, lau mồ hôi trên mặt. ‘Mình đâu có nghe thấy gì ...’)

But Hermione gave a sudden gasp, pointing down the corridor. (Nhưng Hermione đột nhiên nấc lên một tiếng nghẹn ngào, chỉ tay dọc theo hành lang.)

‘Look!’ (‘Nhìn kìa!’)

Something was shining on the wall ahead. (Có thứ gì đó đang phát sáng trên bức tường phía trước.) They approached, slowly, squinting through the darkness. (Họ chầm chậm tiến lại gần, nheo mắt nhìn qua bóng tối.) Foot-high words had been daubed on the wall between two windows, (Những dòng chữ cao cả foot được bôi trét trên tường giữa hai ô cửa sổ,) shimmering in the light cast by the flaming torches. (le lói dưới ánh sáng hắt ra từ những ngọn đuốc rực cháy.)

THE CHAMBER OF SECRETS HAS BEEN OPENED. (PHÒNG CHỨA BÍ MẬT ĐÃ MỞ.)

ENEMIES OF THE HEIR, BEWARE. (KẺ THÙ CỦA NGƯỜI KẾ VỊ, HÃY COI CHỪNG.)

‘What’s that thing – hanging underneath?’ said Ron, (‘Cái thứ gì – treo lủng lẳng bên dưới kia vậy?’ Ron hỏi,) a slight quiver in his voice. (giọng cậu hơi run rẩy.)

As they edged nearer, Harry almost slipped over: (Khi họ nhích lại gần hơn, Harry suýt nữa trượt ngã:) there was a large puddle of water on the floor. (có một vũng nước lớn trên sàn.) Ron and Hermione grabbed him, (Ron và Hermione tóm lấy cậu,) and they inched towards the message, (và họ nhích dần về phía thông điệp đó,) eyes fixed on a dark shadow beneath it. (mắt dán chặt vào một cái bóng đen bên dưới nó.) All three of them realised what it was at once, (Cả ba người ngay lập tức nhận ra đó là cái gì,) and leapt backwards with a splash. (và giật bắn mình lùi lại làm nước văng tung tóe.)

Mrs Norris, the caretaker’s cat, (Bà Norris, con mèo của người giám thị,) was hanging by her tail from the torch bracket. (đang bị treo lủng lẳng bằng đuôi trên giá đỡ đuốc.) She was stiff as a board, her eyes wide and staring. (Nó cứng đơ như một khúc gỗ, đôi mắt mở to và trừng trừng.)

For a few seconds, they didn’t move. (Trong vài giây, họ không nhúc nhích.) Then Ron said, ‘Let’s get out of here.’ (Rồi Ron lên tiếng, ‘Chúng ta rời khỏi đây thôi.’)

‘Shouldn’t we try and help –’ Harry began awkwardly. (‘Chẳng lẽ tụi mình không cố gắng giúp –’ Harry lúng túng bắt đầu.)

‘Trust me,’ said Ron. (‘Tin mình đi,’ Ron nói.) ‘We don’t want to be found here.’ (‘Chúng ta không muốn bị phát hiện ở đây đâu.’)

But it was too late. (Nhưng đã quá muộn.) A rumble, as though of distant thunder, (Một tiếng ầm ầm, như thể tiếng sấm đằng xa,) told them that the feast had just ended. (cho họ biết rằng bữa tiệc vừa mới kết thúc.) From either end of the corridor where they stood (Từ cả hai đầu của hành lang nơi họ đang đứng) came the sound of hundreds of feet climbing the stairs, (vang lên tiếng hàng trăm bước chân leo cầu thang,) and the loud, happy talk of well-fed people; (và tiếng trò chuyện vui vẻ, ồn ào của những con người vừa được ăn no nê;) next moment, students were crashing into the passage from both ends. (khoảnh khắc tiếp theo, học sinh từ hai đầu ùa vào chật kín hành lang.)

The chatter, the bustle, the noise died suddenly (Tiếng xì xầm, sự nhộn nhịp, tiếng ồn ào đột ngột tắt lịm) as the people in front spotted the hanging cat. (khi những người đi đầu phát hiện ra con mèo đang bị treo lủng lẳng.) Harry, Ron and Hermione stood alone, in the middle of the corridor, (Harry, Ron và Hermione đứng trơ trọi giữa hành lang,) as silence fell among the mass of students, (khi sự im lặng bao trùm lấy đám đông học sinh,) pressing forward to see the grisly sight. (đang dồn lên phía trước để xem cảnh tượng rùng rợn đó.)

Then someone shouted through the quiet. (Rồi ai đó hét lên giữa sự tĩnh lặng.)

‘Enemies of the heir, beware! (‘Kẻ thù của người kế vị, hãy coi chừng!) You’ll be next, Mudbloods!’ (Bọn mày sẽ là những kẻ tiếp theo, lũ Máu bùn!’)

It was Draco Malfoy. (Đó là Draco Malfoy.) He had pushed to the front of the crowd, (Nó đã chen lên đứng ngay hàng đầu của đám đông,) his cold eyes alive, his usually bloodless face flushed, (đôi mắt lạnh lẽo của nó sống động, khuôn mặt thường ngày nhợt nhạt của nó giờ đỏ bừng lên,) as he grinned at the sight of the hanging, immobile cat. (khi nó nhếch mép cười trước cảnh tượng con mèo bất động bị treo lủng lẳng.)
